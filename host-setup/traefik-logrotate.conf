# traefik-logrotate.conf — rotates Traefik's file-based access/error logs.
# Traefik has no built-in size-based rotation; it relies on an external tool (this) plus
# a USR1 signal telling it to close and reopen the log file at the same path (not SIGHUP,
# and not copytruncate — copytruncate can drop lines written between copy and truncate).
#
# Deploy to: /volume1/dev/traefik-logrotate.conf
# Run via:   /usr/bin/logrotate --state /volume1/dev/traefik-logrotate.state -f /volume1/dev/traefik-logrotate.conf
# Register as a DSM Task Scheduler daily task (see host-setup/README.md), NOT relying on
# DSM's own /etc/logrotate.d trigger — that mechanism silently stopped firing for this log
# at some point (evidenced by rotated files stopping mid-June while access.log kept growing
# to 1.6GB), and its trigger source on this DSM could not be confirmed.
#
# State file and config both live on /volume1 (not /etc) so they survive DSM resets, same
# reasoning as the rest of host-setup/.

/volume1/docker/apps/traefik/logs/access.log
/volume1/docker/apps/traefik/logs/traefik.log {
    daily
    rotate 7
    compress
    compresscmd /usr/bin/xz
    compressext .xz
    missingok
    notifempty
    sharedscripts
    postrotate
        docker kill -s USR1 traefik >/dev/null 2>&1 || true
    endscript
}
